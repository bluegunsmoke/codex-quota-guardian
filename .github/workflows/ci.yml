name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.422
      - name: Restore
        run: dotnet restore CodexGuardian.sln
      - name: Build
        run: dotnet build CodexGuardian.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/CodexGuardian.Tests/CodexGuardian.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Audit vulnerable dependencies
        shell: powershell
        run: |
          $report = dotnet list CodexGuardian.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $vulnerableProjects = @($report.projects | Where-Object {
            $_.PSObject.Properties.Name -contains 'frameworks' -and $null -ne $_.frameworks
          })
          if ($vulnerableProjects.Count -ne 0) { throw 'Known vulnerable NuGet dependencies were found.' }
      - name: Validate Skill
        shell: powershell
        run: .\scripts\validate-skill.ps1
      - name: Validate localization
        shell: powershell
        run: .\scripts\validate-localization.ps1
      - name: Build and audit Windows candidate
        shell: powershell
        run: .\scripts\run-release-audit.ps1
